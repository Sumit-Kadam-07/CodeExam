services:

  backend:

    build: ./backend

    container_name: codeexam-backend

    restart: always

    ports:
      - "8080:8080"

    environment:

      MYSQL_URL: ${MYSQL_URL}

      MYSQL_USER: ${MYSQL_USER}

      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      AI_API_KEY: ${AI_API_KEY}

  frontend:

    build: ./frontend

    container_name: codeexam-frontend

    restart: always

    ports:
      - "80:80"

    depends_on:
      - backend
