spring.application.name=online-exam
server.port=5001

# ═══════════════════════════════════════════
# Database — MySQL
# ═══════════════════════════════════════════
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

file.upload-dir=./uploads/

# ═══════════════════════════════════════════
# File Upload Limits (for question file uploads)
# ═══════════════════════════════════════════
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ═══════════════════════════════════════════
# JWT Configuration
# ═══════════════════════════════════════════
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# ═══════════════════════════════════════════
# Judge0 Code Execution Service (optional)
# ═══════════════════════════════════════════
# Set enabled=true and provide your API key to use Judge0.
# When disabled (default), the local compiler/interpreter is used.
judge0.enabled=false
judge0.url=https://judge0-ce.p.rapidapi.com
judge0.api-key=
judge0.connect-timeout-ms=5000
judge0.read-timeout-ms=30000
judge0.poll-interval-ms=500
judge0.max-poll-attempts=60

# ═══════════════════════════════════════════
# AI Question Generation (Groq - free tier)
# ═══════════════════════════════════════════
# Get free API key at https://console.groq.com
ai.provider=${AI_PROVIDER:openai}
ai.api-url=${AI_API_URL:https://api.groq.com/openai/v1/chat/completions}
ai.api-key=${AI_API_KEY}
ai.model=${AI_MODEL:llama-3.3-70b-versatile}
